<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Operación Rescate · Parcial</title>
<style>
:root{--bg:#F4F2EC;--ink:#14213D;--ink2:#46506A;--line:#E2DED3}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 16px}
main{max-width:520px;width:100%;text-align:center}
.mark{width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,#0E7490,#B45309 55%,#9F1239);margin:0 auto}
h1{font-size:clamp(28px,7vw,40px);margin:18px 0 10px;letter-spacing:-.02em}
p{color:var(--ink2);margin:0 auto 8px;max-width:420px}
.box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;margin-top:22px;box-shadow:0 1px 2px rgba(20,33,61,.05)}
.box b{font-size:17px}
</style>
</head>
<body>
<main>
<div class="mark" aria-hidden="true"></div>
<h1>Operación Rescate</h1>
<p>Parcial de Emprendimiento · Ingeniería de Software · FET.</p>
<div class="box">
<b>Abre el enlace que te dio el profesor.</b>
<p style="margin-top:8px">Este parcial se presenta desde el enlace exacto que el profesor compartió con tu grupo. Si llegaste aquí, vuelve a ese enlace para empezar.</p>
</div>
</main>
</body>
</html>
