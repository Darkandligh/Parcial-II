<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Panel del profesor · Operación Rescate</title>
<style>
:root{--bg:#F4F2EC;--paper:#fff;--ink:#14213D;--ink2:#46506A;--mute:#7A8299;--line:#E2DED3;--navy:#0B1F3A;
  --org:#0E7490;--dir:#B45309;--ctl:#9F1239;--ok:#15803D;--bad:#B91C1C;--warn:#B45309;--focus:#2563EB}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
h1,h2,h3{margin:0;line-height:1.2}
p{margin:0}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.top{background:var(--navy);color:#fff}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:58px;flex-wrap:wrap}
.brand{font-weight:800;display:flex;gap:10px;align-items:center}
.brand i{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--org),var(--dir) 55%,var(--ctl))}
.brand small{display:block;font-weight:500;opacity:.7;font-size:12px}
.sp{flex:1}
main{padding:20px 0 60px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 1px 2px rgba(20,33,61,.05)}
.card+.card,.grid+.card,.card+.grid{margin-top:16px}
.grid>.card{margin-top:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
.lab{font-size:13px;font-weight:700;color:var(--ink2);display:block;margin-bottom:5px}
.inp{width:100%;font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#FCFBF8;color:var(--ink)}
.set{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:12px}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:700;background:var(--ink);color:#fff;min-height:42px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{padding:6px 10px;min-height:34px;font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.note{font-size:13px;color:var(--mute)}
.err{color:var(--bad);font-size:14px;margin-top:8px;min-height:20px}
.drop{border:2px dashed var(--line);border-radius:14px;padding:22px;text-align:center;background:#FCFBF8;margin-top:12px}
.drop.on{border-color:var(--focus);background:#EEF4FF}
textarea{width:100%;min-height:80px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;border:1.5px solid var(--line);border-radius:10px;padding:10px;background:#FCFBF8}
.lock{max-width:460px;margin:60px auto}
.lock h1{font-size:28px;margin:6px 0 8px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.scrollx{overflow-x:auto}
.grade{font-weight:800;font-size:16px}
.grade.pass{color:var(--ok)}.grade.fail{color:var(--bad)}
.al{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;margin:0 4px 4px 0;background:#FEF3C7;color:#92400E}
.al.r{background:#FEE2E2;color:#991B1B}
.al.i{background:#E8EEF9;color:#1E3A8A}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:12px}
.stat{background:#FCFBF8;border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-size:24px}
.stat span{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.qa{border-top:1px solid var(--line);padding:14px 0}
.qa h3{font-size:16px;display:flex;gap:10px;justify-content:space-between;align-items:baseline;flex-wrap:wrap}
.pts{font-weight:800;white-space:nowrap}
.pts.full{color:var(--ok)}.pts.none{color:var(--bad)}.pts.part{color:var(--warn)}
.ph{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:999px;color:#fff}
.ph.org{background:var(--org)}.ph.dir{background:var(--dir)}.ph.ctl{background:var(--ctl)}
.ex{background:#F6F4EE;border-radius:10px;padding:10px 12px;margin-top:8px;color:var(--ink2);font-size:14px}
.mini td,.mini th{padding:5px 6px;font-size:13px}
.y{color:var(--ok);font-weight:800}.x{color:var(--bad);font-weight:800}
.ans{margin-top:6px;font-size:14px}
.ans b{color:var(--ink2)}
.panel{margin-top:16px}
.hide{display:none}
.ev{font-size:13px;padding:4px 0;border-bottom:1px dashed var(--line)}
.ev:last-child{border-bottom:0}
.stt{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap}
.stt i{width:8px;height:8px;border-radius:50%;background:currentColor}
.stt.on{background:#DCFCE7;color:#166534}.stt.out{background:#FEF3C7;color:#92400E}.stt.off{background:#E5E7EB;color:#374151}.stt.fin{background:#E8EEF9;color:#1E3A8A}.stt.file{background:#F3F4F6;color:#4B5563}
.stt.out{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
.livebar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--ink2)}
.livebar .dotl{width:10px;height:10px;border-radius:50%;background:#22C55E;box-shadow:0 0 0 4px #DCFCE7}
.livebar .dotl.err{background:#EF4444;box-shadow:0 0 0 4px #FEE2E2}
.prog{display:inline-block;width:64px;height:6px;border-radius:3px;background:#E5E7EB;vertical-align:middle;margin-left:6px;overflow:hidden}
.prog b{display:block;height:100%;background:var(--ink)}
.muted{color:var(--mute);font-weight:600}
@media (max-width:760px){.grid,.set,.stats{grid-template-columns:1fr 1fr}}
@media print{
  body{background:#fff}
  .top,.noprint{display:none!important}
  .card{border:0;box-shadow:none;padding:0}
  .printme{display:block!important}
  .qa{break-inside:avoid}
}
</style>
</head>
<body>
