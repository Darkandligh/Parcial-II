<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Parcial · Operación Rescate (20 preguntas)</title>
<style>
:root{
  --bg:#F4F2EC;--paper:#FFFFFF;--ink:#14213D;--ink2:#46506A;--mute:#7A8299;--line:#E2DED3;
  --navy:#0B1F3A;--org:#0E7490;--org-s:#E0F2F5;--dir:#B45309;--dir-s:#FDF0E1;--ctl:#9F1239;--ctl-s:#FBE7EC;
  --b1:#166534;--b1-s:#E7F5EC;--b2:#1E3A8A;--b2-s:#E8EEF9;--ok:#15803D;--warn:#B45309;--bad:#B91C1C;--focus:#2563EB;
  --r:16px;--sh:0 1px 2px rgba(20,33,61,.06),0 8px 24px rgba(20,33,61,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;min-height:100vh}
body.free{-webkit-user-select:text;user-select:text}
/* tema juego */
body.game{--bg:#0E1A2B}
body.game .top{background:#060E1A}
body.game .card{box-shadow:0 1px 2px rgba(0,0,0,.2),0 10px 30px rgba(0,0,0,.18)}
.mission{display:flex;gap:16px;align-items:center;background:linear-gradient(135deg,#0E7490,#9F1239);color:#fff;border-radius:18px;padding:20px 22px;margin:6px 0 2px}
.mission .bot{flex:0 0 52px;height:52px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:28px}
.mission h1{font-size:clamp(26px,6vw,40px);margin:0;color:#fff}
.mission p{color:rgba(255,255,255,.9);margin-top:4px}
.energy{width:100%}
.energy b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.8;margin-bottom:4px}
.ebar{height:12px;border-radius:7px;background:rgba(255,255,255,.14);overflow:hidden}
.ebar i{display:block;height:100%;border-radius:7px;background:linear-gradient(90deg,#34D399,#FBBF24);transition:width .4s}
.badge{display:inline-flex;gap:8px;align-items:center;background:var(--s);color:var(--c);border-radius:999px;padding:6px 14px;font-weight:800;font-size:14px;margin-top:10px}
.cheer{color:var(--ok)!important;font-weight:700}
.gmap{margin-top:6px}
.ghead{margin-bottom:6px}
.lane{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:14px 16px;margin-top:12px}
.lane-h{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:14px;color:#e2e8f0;display:flex;align-items:center;gap:8px}
.lane-h i{width:10px;height:10px;border-radius:50%;background:var(--dot)}
.path{display:flex;align-items:center;overflow-x:auto;padding:8px 2px}
.conn{flex:1 0 16px;height:4px;border-radius:3px;background:rgba(255,255,255,.14);min-width:14px}
.conn.on{background:#34D399}
.mnode{flex:0 0 auto;width:60px;min-width:60px;height:60px;border-radius:50%;border:3px solid rgba(255,255,255,.22);background:#0b1726;color:#fff;display:grid;place-items:center;position:relative;font-weight:800;font-size:18px;cursor:pointer;padding:0}
.mnode .ic{font-size:18px}
.mnode.done{background:var(--c);border-color:#34D399}
.mnode.now{border-color:#FBBF24;box-shadow:0 0 0 4px rgba(251,191,36,.22);animation:gpulse 1.5s infinite}
.mnode.open{border-color:#fff}
.mnode.lock{opacity:.5;cursor:not-allowed}
.mnode:not(.lock):hover{transform:translateY(-2px)}
.mnode .av{position:absolute;top:-28px;font-size:24px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))}
@keyframes gpulse{50%{box-shadow:0 0 0 9px rgba(251,191,36,.06)}}
.control{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,#0E7490,#9F1239);border-radius:18px;padding:16px 18px;margin-top:16px;color:#fff}
.control .cz{flex:0 0 48px;height:48px;border-radius:12px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-size:26px}
.control .cz.ready{animation:gpulse 1.5s infinite}
.control b{font-size:17px}

input,textarea{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3{line-height:1.2;margin:0}
p{margin:0}
.wrap{max-width:880px;margin:0 auto;padding:0 16px}

/* barra superior */
.top{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:56px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.brand{font-weight:800;letter-spacing:.02em;display:flex;align-items:center;gap:10px}
.brand i{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--org),var(--dir) 55%,var(--ctl));display:inline-block}
.brand small{display:block;font-weight:500;opacity:.7;font-size:12px;letter-spacing:0}
.top .sp{flex:1}
.pill{font-size:13px;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.12);white-space:nowrap}
.pill.warn{background:#7C2D12}
.pill.net i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#4ADE80;margin-right:6px}
.pill.net.off i{background:#FBBF24}
.sendst{padding:12px 14px;border-radius:12px;margin:12px 0;font-weight:600}
.sendst.ok{background:#ECFDF3;color:#166534;border:1px solid #BBF7D0}
.sendst.wait{background:#FEF9C3;color:#854D0E;border:1px solid #FDE68A}
.sendst.fail{background:#FEF2F2;color:#991B1B;border:1px solid #FECACA}
.steps{display:flex;gap:6px;width:100%;padding-bottom:4px}
.seg{flex:1;min-width:0}
.seg b{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;opacity:.8;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:3px}
.dot{flex:1;height:7px;border-radius:4px;background:rgba(255,255,255,.18);border:0;padding:0}
.dot.part{background:rgba(255,255,255,.5)}
.dot.done{background:var(--c)}
.dot.cur{box-shadow:0 0 0 2px #fff}

/* tarjetas */
main{padding:22px 0 60px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:22px}
.card+.card{margin-top:16px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--c,var(--ink2))}
.hero{padding:34px 0 18px}
.hero h1{font-size:clamp(30px,6vw,46px);font-weight:850;letter-spacing:-.02em;margin:8px 0 10px}
.hero p{color:var(--ink2);font-size:18px;max-width:640px}
.cycle{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0 4px}
.cycle div{border-radius:14px;padding:14px;background:var(--s);border:1px solid color-mix(in srgb,var(--c) 25%,transparent)}
.cycle b{display:block;color:var(--c);font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.cycle span{font-weight:700;font-size:15px}
.rules{display:grid;gap:10px;margin:16px 0 0;padding:0;list-style:none}
.rules li{display:flex;gap:10px;align-items:flex-start;color:var(--ink2);font-size:15px}
.rules li::before{content:"";flex:0 0 8px;height:8px;border-radius:50%;background:var(--ink);margin-top:8px}
.field{display:grid;gap:6px;margin-top:14px}
.lab{font-size:13px;font-weight:700;color:var(--ink2)}
.inp{width:100%;font:inherit;font-size:17px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#FCFBF8;color:var(--ink)}
.inp:focus{border-color:var(--focus);outline:none;background:#fff}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:12px}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:16px;font-size:15px;color:var(--ink2)}
.check input{width:20px;height:20px;margin-top:2px;flex:0 0 auto}
.msg{color:var(--bad);font-size:14px;min-height:20px;margin-top:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:700;background:var(--ink);color:#fff;min-height:46px}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{background:#fff}
.btn.c{background:var(--c)}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
.btn.small{padding:8px 12px;min-height:38px;font-size:14px}
.note{font-size:13px;color:var(--mute)}

/* fase */
.phase{border-top:6px solid var(--c)}
.phase .num{font-size:64px;font-weight:900;color:var(--c);line-height:1;opacity:.9}
.phase h2{font-size:34px;margin:6px 0 4px}
.phase .q{font-size:20px;font-weight:700;color:var(--c);margin-bottom:12px}
.phase p{color:var(--ink2);font-size:17px;max-width:640px}

/* pregunta */
.qhead{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.kind{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--s);color:var(--c)}
.qcard{border-top:6px solid var(--c)}
.qcard h2{font-size:24px;margin:10px 0 8px}
.prompt{color:var(--ink2);font-size:17px}
.vis{margin:16px 0 4px}
.body{margin-top:18px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--line);background:#FCFBF8;border-radius:14px;padding:14px;margin-top:10px;font-size:16px}
.opt:hover{border-color:var(--c)}
.opt .k{flex:0 0 28px;height:28px;border-radius:8px;display:grid;place-items:center;font-weight:800;background:#EEEAE0;font-size:14px}
.opt.sel{border-color:var(--c);background:var(--s)}
.opt.sel .k{background:var(--c);color:#fff}
.hint{font-size:13px;color:var(--mute);margin-top:8px}

.items{display:grid;gap:12px}
.it{border:1.5px solid var(--line);border-radius:14px;padding:12px;background:#FCFBF8}
.it.set{border-color:color-mix(in srgb,var(--c) 45%,var(--line))}
.it p{font-weight:600;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:14px;line-height:1.25;text-align:left}
.chip:hover{border-color:var(--c)}
.chip.on{background:var(--c);border-color:var(--c);color:#fff}
.chip.used{opacity:.55}

.chain{display:grid;gap:8px}
.slot{display:flex;gap:10px;align-items:center;min-height:52px;border:1.5px dashed var(--line);border-radius:12px;padding:8px 12px;color:var(--mute);background:#FCFBF8;text-align:left;width:100%}
.slot .n{flex:0 0 28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;background:#EEEAE0;color:var(--ink2)}
.slot.full{border-style:solid;border-color:var(--c);color:var(--ink);background:var(--s)}
.slot.full .n{background:var(--c);color:#fff}
.slot.full::after{content:"✕";margin-left:auto;color:var(--mute);font-size:13px;padding-left:8px}
.pool{display:grid;gap:8px;margin-top:14px}
.card2{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px;text-align:left;font-size:15px}
.card2:hover{border-color:var(--c);background:var(--s)}
.sub{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:16px 0 8px}

.legend{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
.legend div{background:var(--s);border-radius:10px;padding:8px;font-size:13px;color:var(--ink2)}
.legend b{display:block;color:var(--c);font-size:18px}
.raci{border:1.5px solid var(--line);border-radius:14px;padding:14px;background:#FCFBF8}
.raci+.raci{margin-top:12px}
.raci h3{font-size:17px}
.raci .d{color:var(--ink2);font-size:15px;margin:6px 0 10px}
.rrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.seg4{display:flex;gap:4px}
.seg4 button{width:44px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-weight:800}
.seg4 button.on{background:var(--c);border-color:var(--c);color:#fff}

.nfs{display:grid;gap:14px}
.nf .iw{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;background:#FCFBF8;overflow:hidden;max-width:420px}
.nf .iw:focus-within{border-color:var(--focus);background:#fff}
.nf .iw span{padding:0 12px;color:var(--mute);font-weight:700}
.nf input{border:0;background:transparent;font:inherit;font-size:18px;padding:12px 12px;width:100%;outline:none;color:var(--ink)}

/* visuales */
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:14px;background:#FCFBF8}
.tree{min-width:640px;padding:18px 12px;text-align:center}
.tree .lvl{display:flex;justify-content:center;gap:10px;position:relative}
.node{background:#fff;border:1.5px solid var(--ink);border-radius:10px;padding:7px 10px;font-size:13px;font-weight:700;min-width:120px}
.node small{display:block;font-weight:500;color:var(--mute);font-size:11px}
.node.top{background:var(--navy);color:#fff;border-color:var(--navy)}
.node.top small{color:#C9D2E3}
.tree .v{width:2px;height:16px;background:var(--ink);margin:0 auto}
.tree .bar{height:2px;background:var(--ink);margin:0 auto;width:78%}
.tree .col{display:flex;flex-direction:column;align-items:center;flex:1}
.tree .col .node+.v{display:block}
.svgbox svg{width:100%;height:auto;display:block}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
td.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.tag{font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;white-space:nowrap}
.t-fin{background:#E8EEF9;color:#1E3A8A}.t-cli{background:#FDF0E1;color:#9A3412}.t-pro{background:#E0F2F5;color:#155E75}.t-apr{background:#EDE9FE;color:#5B21B6}
.chg{font-weight:800;white-space:nowrap}.chg.g{color:var(--ok)}.chg.b{color:var(--bad)}.chg.s{color:var(--mute);font-weight:600}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.team{border:1px solid var(--line);border-radius:14px;padding:14px;background:#FCFBF8}
.team b{font-size:16px}
.sq{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin:10px 0 8px}
.sq i{aspect-ratio:1;border-radius:4px;background:#2F6F4F}
.sq i.l{background:#E4A0A0}
.team p{font-size:13px;color:var(--ink2)}

.desk{display:grid;gap:14px}
.pile{display:flex;flex-wrap:wrap;gap:8px}
.doc{border:1.5px solid var(--line);background:#FFFDF6;border-radius:10px;padding:8px 10px;font-size:13px;text-align:left;min-width:104px;box-shadow:0 1px 0 var(--line)}
.doc b{display:block;font-size:11px;letter-spacing:.08em;color:var(--mute)}
.doc span{display:block;font-weight:800;font-variant-numeric:tabular-nums}
.doc:hover{border-color:var(--c)}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.sl{border:1.5px dashed var(--line);border-radius:10px;padding:6px 8px;font-size:12px;min-height:52px;color:var(--mute)}
.sl b{display:block;color:var(--ink2)}
.sl.f{border-style:solid;border-color:color-mix(in srgb,var(--c) 40%,var(--line));background:#fff;color:var(--ink)}
.sl.m{border-color:var(--bad);color:var(--bad);font-weight:800;background:#FEF2F2}
.score{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.score div{border:1px solid var(--line);border-radius:12px;padding:10px;background:#FCFBF8}
.score span{display:block;font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.score b{font-variant-numeric:tabular-nums}
.score em{display:block;font-style:normal;font-size:13px;color:var(--ink2)}

.nav{display:flex;gap:10px;justify-content:space-between;margin-top:22px;flex-wrap:wrap}
.status{font-size:13px;color:var(--mute);margin-top:12px}
.status.ok{color:var(--ok)}

/* revisión */
.rv{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.rv:first-of-type{border-top:0}
.rv .n{flex:0 0 30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--s);color:var(--c)}
.rv .t{flex:1;font-weight:600}
.st{font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px}
.st.ok{background:#DCFCE7;color:#166534}.st.pa{background:#FEF3C7;color:#92400E}.st.no{background:#FEE2E2;color:#991B1B}
.confirm{margin-top:16px;border:1.5px solid var(--bad);border-radius:14px;padding:14px;background:#FEF2F2}

/* entrega */
.seal{display:flex;align-items:center;gap:14px;padding:16px;border-radius:14px;background:#ECFDF3;border:1px solid #BBF7D0;margin:16px 0}
.seal i{flex:0 0 46px;height:46px;border-radius:50%;background:var(--ok);display:grid;place-items:center;color:#fff;font-style:normal;font-size:24px;font-weight:900}
.hash{font:700 20px/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.06em}
textarea.code{width:100%;height:90px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;border:1.5px solid var(--line);border-radius:12px;padding:10px;background:#FCFBF8;resize:vertical}
.learn{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.learn div{background:var(--s);border-radius:12px;padding:12px;font-size:14px;color:var(--ink2)}
.learn b{display:block;color:var(--c);margin-bottom:4px}

/* bloqueo */
.ov{position:fixed;inset:0;z-index:50;background:rgba(11,31,58,.96);color:#fff;display:grid;place-items:center;padding:20px}
.ov .box{max-width:460px;text-align:center}
.ov h2{font-size:28px;margin-bottom:10px}
.ov p{opacity:.85;margin-bottom:8px}
.ov .btn{background:#fff;color:var(--navy);margin-top:14px}
.ov .big{font-size:56px;font-weight:900;line-height:1;margin-bottom:6px}

@media (max-width:640px){
  .grid2,.cycle,.learn,.teams,.score{grid-template-columns:1fr}
  .slots{grid-template-columns:repeat(3,1fr)}
  .legend{grid-template-columns:repeat(2,1fr)}
  .card{padding:18px}
  .qcard h2{font-size:21px}
  .phase .num{font-size:48px}
}
@media print{body *{display:none!important}body::after{content:"Impresión deshabilitada durante el parcial.";display:block!important}}
</style>
</head>
<body>
<noscript><p style="padding:20px">Este parcial necesita JavaScript activado.</p></noscript>
<header class="top" id="bar"></header>

<script>!function(){"use strict";var e={ver:"P20",build:"E04B17",label:"Versión completa · 20 preguntas",course:"Emprendimiento · Ingeniería de Software · FET",phases:{org:{name:"Organizar",n:"Fase 2 del proceso administrativo",story:"Primero hay que poner orden. En NeivaSoft nadie tiene claro quién hace qué, quién decide ni cómo se trabaja entre áreas. Tu misión en esta fase: darle a la empresa una estructura que funcione.",goal:"¿Con qué y con quién?"},dir:{name:"Dirigir",n:"Fase 3 del proceso administrativo",story:"La estructura ya existe, pero un plan en papel no se ejecuta solo. Ahora hay que mover a las personas: liderar, motivar, comunicar, decidir y anticipar los riesgos.",goal:"¿Cómo movemos al equipo?"},ctl:{name:"Controlar",n:"Fase 4 del proceso administrativo",story:"La gerencia dice que todo va bien porque las ventas suben. Tu última misión: comprobar con números si el rescate está funcionando y si esos números son reales.",goal:"¿Lo estamos logrando?"}},qs:[{id:"O1",ph:"org",type:"assign",title:"Síntomas del desorden",prompt:"Estos son reportes del primer día en NeivaSoft. Clasifica cada uno según el problema que muestra.",unique:!1,buckets:[{id:"fb44fa4e",t:"Duplicidad de tareas"},{id:"dfed4494",t:"Retrasos"}],items:[{id:"ad804a9e",t:"La entrega del sprint se frenó esperando una aprobación que nadie tenía asignada."},{id:"18b417ff",t:"Soporte y ventas llamaron al mismo cliente, el mismo día, por el mismo caso."},{id:"c50ab6ce",t:"Dos personas hicieron por separado el inventario de portátiles."},{id:"f6e3e85b",t:"Dos desarrolladores programaron el mismo módulo de inicio de sesión sin saberlo."},{id:"9a51244d",t:"El informe para el cliente salió una semana tarde porque nadie sabía a quién le tocaba."},{id:"bb1bab10",t:"La migración se atrasó porque redes y desarrollo no se pusieron de acuerdo en la fecha."}]},{id:"O2",ph:"org",type:"assign",title:"¿Para qué sirve organizar?",prompt:"En cada situación falta una función de la organización. Une cada situación con la pregunta que la organización debe responder.",unique:!0,buckets:[{id:"fbb3f363",t:"División del trabajo: ¿quién hace qué?"},{id:"d9dda418",t:"Responsabilidad: ¿quién responde?"},{id:"b7ae0c1e",t:"Autoridad: ¿quién decide?"},{id:"3d378b6f",t:"Coordinación: ¿cómo trabajamos juntos?"},{id:"ca5f26db",t:"Recursos: ¿con qué contamos?"}],items:[{id:"95ca66ea",t:"QA no se entera cuándo desarrollo termina una funcionalidad."},{id:"214b09dd",t:"Nadie sabe si el líder técnico puede aprobar un cambio sin el gerente."},{id:"4caef3be",t:"En el tablero de tareas hay tres tareas sin dueño."},{id:"556be97f",t:"Llegan cinco personas nuevas y nadie sabe cuántos portátiles y licencias hay."},{id:"c6d3544a",t:"Cuando una entrega falla, todos se culpan entre sí."}]},{id:"O3",ph:"org",type:"mc",title:"Lo que el organigrama no dice",prompt:"Este es el nuevo organigrama de NeivaSoft. La gerente dice: «Con esto ya conocemos toda la empresa». ¿Qué le responderías?",visual:"org1",options:[{id:"00059e75",t:"Tiene razón, siempre que se actualice cada mes con los nombres de los clientes y de los proveedores con los que trabaja cada una de las áreas de la empresa."},{id:"b0848226",t:"Tiene razón: un organigrama bien hecho muestra todo lo que pasa en la empresa, incluida la cultura, la comunicación informal y la forma real de trabajar de cada equipo."},{id:"dc0874b9",t:"No del todo: el organigrama muestra la estructura (áreas, cargos y quién reporta a quién), pero no muestra la cultura ni cómo se comunica la gente en el día a día."},{id:"bfc7e795",t:"No del todo: el organigrama no sirve para ver quién reporta a quién ni la estructura de áreas; eso solo se sabe con una matriz RACI elaborada para cada proyecto."}]},{id:"O4",ph:"org",type:"mc",title:"La idea de Microsoft",prompt:"Microsoft organiza su trabajo en grandes áreas de negocio (nube, productividad, seguridad, gaming…), cada una con su equipo. NeivaSoft tiene tres productos: una app de domicilios, un software contable y páginas web para clientes. Si aplica la misma idea, ¿qué debe hacer y qué elemento de la estructura está usando?",options:[{id:"80727a74",t:"Crear un equipo por producto, cada uno con su líder. Está aplicando la departamentalización."},{id:"c68b9ed6",t:"Agrupar a las personas según la fecha en que entraron a la empresa. Está aplicando la cultura organizacional."},{id:"9483a3b8",t:"Poner a las 40 personas a trabajar en los tres productos a la vez. Está aplicando la flexibilidad."},{id:"5b554548",t:"Que el gerente apruebe cada tarea de cada persona. Está aplicando la jerarquía y la cadena de mando."}]},{id:"O5",ph:"org",type:"raci",title:"Matriz RACI",prompt:"Llena la matriz RACI de dos actividades de NeivaSoft según lo que se describe.",rows:[{id:"e2acfa97",act:"Publicar una nueva versión de la app",desc:"El desarrollador hace el cambio. La gerente da la aprobación final. QA da su concepto antes de publicar. Al cliente solo se le avisa cuando ya está publicada.",roles:[{id:"0d3e5c9e",t:"Gerente"},{id:"b96803e5",t:"Cliente"},{id:"79a62481",t:"QA"},{id:"7c87e960",t:"Desarrollador"}]},{id:"a3ecd2d3",act:"Definir los requerimientos de un proyecto",desc:"La analista de negocio los escribe. El líder del proyecto los aprueba. El cliente aporta la información. El equipo técnico recibe el documento final.",roles:[{id:"be6011d5",t:"Cliente"},{id:"76258911",t:"Líder del proyecto"},{id:"d1e92c7a",t:"Equipo técnico"},{id:"3ea7d3c3",t:"Analista de negocio"}]}]},{id:"O6",ph:"org",type:"order",title:"Diseño de procesos",prompt:"NeivaSoft dibuja su proceso para atender la solicitud de un cliente. Ordena los pasos desde que llega la solicitud hasta que el cambio queda en producción.",items:[{id:"62bc6e0d",t:"Hacer las pruebas de calidad (QA)"},{id:"38ace293",t:"Analizar el requerimiento"},{id:"00b113e4",t:"Desarrollar el cambio"},{id:"735cd695",t:"Asignar un responsable"},{id:"7f5c89fa",t:"Desplegar en producción"},{id:"35c38ad2",t:"Recibir la solicitud del cliente"}]},{id:"O7",ph:"org",type:"assign",title:"La herramienta correcta",prompt:"Une cada necesidad de NeivaSoft con la herramienta que mejor la resuelve.",unique:!0,buckets:[{id:"00e88208",t:"Trello"},{id:"f946e548",t:"Matriz RACI"},{id:"25532301",t:"Diseño de procesos"},{id:"2be9d59e",t:"Organigrama"}],items:[{id:"96f1c2e5",t:"Ver en qué estado está cada tarea: por hacer, en curso o terminada."},{id:"8332eea1",t:"Ver quién reporta a quién en la empresa."},{id:"01fc7c58",t:"Encontrar en qué paso se atasca el trabajo."},{id:"a7c4c9a9",t:"Saber quién aprueba cada actividad y a quién hay que consultar."}]},{id:"D1",ph:"dir",type:"mc",title:"Dos jefes, una persona",prompt:"Laura, analista de QA, recibe órdenes del líder de desarrollo y también de la jefa de calidad. Esta semana le pidieron cosas contrarias el mismo día. ¿Qué principio de la dirección se está rompiendo?",visual:"org2",options:[{id:"5a707cdc",t:"Unidad de mando: cada persona debe recibir órdenes de un solo jefe."},{id:"f2ea02ec",t:"Impersonalidad del mando: la autoridad se ejerce por necesidad y no por capricho."},{id:"70a8f343",t:"Vía jerárquica: las órdenes deben respetar los canales de la estructura."},{id:"49d7a8b4",t:"Armonía del objetivo: las metas de cada persona deben ir con las de la empresa."}]},{id:"D2",ph:"dir",type:"assign",title:"Un estilo para cada momento",prompt:"No hay un estilo de liderazgo único. Une cada situación de NeivaSoft con el estilo más adecuado.",unique:!0,buckets:[{id:"d59dcc20",t:"Autocrático"},{id:"b8bbcd60",t:"Democrático"},{id:"4e149c17",t:"Liberal (laissez-faire)"},{id:"a339af9b",t:"Transformacional"},{id:"d284ccf0",t:"Coaching"}],items:[{id:"89cb093c",t:"Un practicante con potencial necesita desarrollar sus habilidades poco a poco."},{id:"42154fa7",t:"La empresa va a cambiar su modelo de negocio y necesita entusiasmar a todos con la nueva visión."},{id:"93833a46",t:"Se cayó el servidor en producción, hay que actuar ya y el equipo es nuevo."},{id:"4afcf7c1",t:"Un equipo de desarrolladores senior, expertos y autónomos."},{id:"e9de3684",t:"Hay que elegir la tecnología del próximo proyecto y el equipo tiene opiniones valiosas."}]},{id:"D3",ph:"dir",type:"mc",title:"¿Qué motiva a Andrés?",prompt:"Andrés, desarrollador, no alcanza a pagar el arriendo con su sueldo. Para motivarlo, el gerente le entrega un diploma de «empleado del mes». Según la pirámide de Maslow, ¿qué va a pasar?",options:[{id:"d16822d2",t:"Lo va a motivar mucho, porque el reconocimiento es la necesidad más importante de todas y siempre pesa mucho más que el hecho de tener un salario que alcance para lo básico."},{id:"a2058f00",t:"No lo va a motivar, porque los diplomas y el reconocimiento público solo funcionan con los cargos directivos y nunca con el personal operativo."},{id:"924df7bf",t:"Lo va a motivar, porque la pirámide de Maslow se cumple de arriba hacia abajo: primero el reconocimiento y al final las necesidades básicas."},{id:"8cf984bd",t:"No lo va a motivar mucho: su necesidad básica (un salario suficiente) no está cubierta, y mientras eso no se resuelva el reconocimiento no lo mueve."}]},{id:"D4",ph:"dir",type:"assign",title:"¿Por dónde viaja el mensaje?",prompt:"Clasifica cada mensaje de NeivaSoft según el tipo de comunicación.",unique:!1,buckets:[{id:"1663f863",t:"Descendente"},{id:"c1c70265",t:"Ascendente"},{id:"8fb498c9",t:"Horizontal"},{id:"d9ea7de3",t:"Informal"}],items:[{id:"89382e87",t:"Un desarrollador le reporta a su líder un error grave en producción."},{id:"03c97147",t:"En la cafetería corre el rumor de que habrá despidos."},{id:"4cfcb935",t:"La gerente envía a todos las metas del trimestre."},{id:"19463627",t:"Desarrollo y QA acuerdan juntos el horario de pruebas."},{id:"30ff8e79",t:"Un practicante le envía a su jefe una sugerencia para mejorar el proceso."}]},{id:"D5",ph:"dir",type:"order",title:"Decidir bajo presión",prompt:"El cliente más grande de NeivaSoft amenaza con irse por los retrasos. Ordena cómo la dirección debe tomar la decisión.",items:[{id:"6a55a324",t:"Evaluar cada opción: costos, ventajas, desventajas y riesgos."},{id:"b4d25429",t:"Evaluar resultados: revisar al mes si las entregas mejoraron."},{id:"62faeb4f",t:"Identificar el problema: las entregas llegan dos semanas tarde."},{id:"7cea91b6",t:"Buscar alternativas: contratar, cambiar prioridades o renegociar fechas."},{id:"f3537a2e",t:"Elegir y ejecutar: cambiar prioridades y avisarle al equipo."}]},{id:"D6",ph:"dir",type:"mc",title:"Delegar no es desaparecer",prompt:"El gerente delega en el líder técnico la entrega del módulo de pagos. El módulo sale con errores y el cliente reclama. ¿Quién responde ante el cliente?",options:[{id:"13cd2595",t:"El gerente: al delegar entregó la tarea y parte de la autoridad, pero no la responsabilidad final."},{id:"dc527dac",t:"Solo el líder técnico: al delegar la tarea, el gerente le pasó también toda la responsabilidad final por el resultado ante el cliente."},{id:"697cb839",t:"Nadie en particular: si la tarea fue delegada, la responsabilidad se reparte por igual."},{id:"fe47e2f5",t:"El cliente, porque fue quien aprobó el proyecto y aceptó las fechas de entrega del módulo de pagos con errores."}]},{id:"D7",ph:"dir",type:"mc",title:"Anticipar el riesgo",prompt:"Un viernes se cae el sistema de facturación que NeivaSoft le administra a un cliente. Durante horas no hay ventas y parte de la información se pierde. ¿Qué tipo de riesgo es y qué haría una buena dirección para que no se repita?",options:[{id:"34f18e2a",t:"Riesgo de proveedores. Cambiar de proveedor de internet y esperar que la falla del sistema no se vuelva a presentar en el futuro."},{id:"c497c75b",t:"Riesgo tecnológico. Buscar al responsable de la caída del sistema y despedirlo de inmediato para dar ejemplo al resto del equipo de trabajo."},{id:"52ad317c",t:"Riesgo tecnológico. Hacer copias de seguridad periódicas, tener un servidor de respaldo y personal capacitado para responder de inmediato."},{id:"dab85f02",t:"Riesgo de mercado. Bajar los precios de inmediato para que el cliente afectado no se vaya a la competencia mientras se restablece el servicio."}]},{id:"C1",ph:"ctl",type:"order",title:"El ciclo del control",prompt:"El soporte de NeivaSoft tarda demasiado en responder. Ordena el ciclo de control.",items:[{id:"aea6ec1a",t:"Volver a planear: usar lo aprendido para fijar la meta del próximo trimestre."},{id:"d7c4e303",t:"Corregir: crear turnos de soporte en las horas con más tickets."},{id:"4c08a178",t:"Medir: hoy un ticket tarda 48 horas en ser respondido."},{id:"6e6b2123",t:"Comparar: la meta es responder en 24 horas."}]},{id:"C2",ph:"ctl",type:"mc",title:"Un KPI de verdad",prompt:"¿Cuál propuesta es un KPI completo para el soporte de NeivaSoft?",options:[{id:"a7307dd3",t:"Seguidores en LinkedIn = conteo que da la propia red social. Meta: llegar a 10.000 seguidores nuevos antes de diciembre. Responsable: el área de mercadeo de la empresa, con revisión del tablero cada semana."},{id:"91504f2c",t:"Tiempo promedio de respuesta = horas totales ÷ tickets atendidos, con datos de la mesa de ayuda. Meta: bajar de 48 a 24 horas antes de diciembre. Responsable: coordinador de soporte, revisión semanal."},{id:"06da809d",t:"Mejorar mucho la atención al cliente y la calidad del soporte en los próximos meses, con el compromiso de todo el equipo y el apoyo de la gerencia."},{id:"0ebf2e1b",t:"Tiempo de respuesta de los tickets. Meta: bajar a 1 hora desde mañana mismo. Responsable: todos los integrantes del área de soporte, sin una persona encargada."}]},{id:"C3",ph:"ctl",type:"assign",title:"Retrovisor, parabrisas o vanidad",prompt:"Clasifica los indicadores que NeivaSoft tiene en su tablero.",unique:!1,buckets:[{id:"4f72d4ad",t:"Rezagado (retrovisor)"},{id:"000f5b10",t:"Adelantado (parabrisas)"},{id:"36adef7d",t:"De vanidad"}],items:[{id:"c1378f95",t:"Descargas de la app, sin saber si alguien la usa."},{id:"19817ff2",t:"Calificación de la app en la tienda de aplicaciones."},{id:"76f375ae",t:"Utilidad del año pasado."},{id:"5b42a1cc",t:"Satisfacción del cliente en la encuesta después de cada entrega."},{id:"49fe981c",t:"Likes en la página de LinkedIn de la empresa."},{id:"d5c5079f",t:"Ventas del mes."}]},{id:"C4",ph:"ctl",type:"num",title:"% de entregas a tiempo",prompt:"NeivaSoft mide el % de entregas a tiempo de dos equipos. Fórmula: entregas en la fecha pactada ÷ entregas totales × 100. Meta: 95 % o más al cierre del trimestre.",visual:"teams",fields:[{id:"8f5f6af7",l:"% de entregas a tiempo del equipo Alfa",kind:"num",suf:"%"},{id:"8bc14dcb",l:"% de entregas a tiempo del equipo Beta",kind:"num",suf:"%"},{id:"60755dbe",l:"¿Qué equipo cumple la meta?",kind:"choice",opts:[{id:"1e074175",t:"Solo Alfa"},{id:"a2e23a12",t:"Solo Beta"},{id:"d73d02f6",t:"Los dos"},{id:"ae521d2c",t:"Ninguno"}]}]},{id:"C5",ph:"ctl",type:"order",title:"La cadena del tablero",prompt:"Las ventas suben y la gerencia está tranquila. Mira el cuadro de mando y ordena la cadena de causa y efecto, desde la causa raíz hasta el efecto en el dinero.",visual:"tablero",items:[{id:"ae07abc1",t:"Clientes: la calificación baja de 4,6 a 3,9 y la renovación de contratos de 80 % a 60 %."},{id:"8af7d6dc",t:"Procesos: las entregas a tiempo bajan de 90 % a 65 % y los errores suben de 3 a 12."},{id:"f17b19bd",t:"Aprendizaje: la rotación de desarrolladores sube de 5 % a 35 %."},{id:"71af93f2",t:"Financiera: las ventas van a caer, aunque hoy suban."}]},{id:"C6",ph:"ctl",type:"num",title:"Auditoría del sábado",prompt:"La administración reporta las ventas del sábado. Archiva todas las facturas y compara lo archivado con el reporte. No necesitas hacer cálculos: la tabla de abajo suma por ti.",visual:"desk",fields:[{id:"3e0ab9e1",l:"Números de las facturas que faltan (sepáralos con coma)",kind:"list"},{id:"2f4e0b6d",l:"¿Qué concluyes al comparar el reporte con lo archivado?",kind:"choice",opts:[{id:"32366c86",t:"El reporte cuadra: que falten facturas un sábado es normal"},{id:"d411976b",t:"No se puede concluir nada sin contratar una auditoría externa"},{id:"
